<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#F8F3EC"/><stop offset="1" stop-color="#E9DED3"/></linearGradient></defs><rect width="1200" height="390" rx="18" fill="url(#b)"/><text x="42" y="48" font-family="Arial" font-size="13" letter-spacing="3" fill="#8A6372">RESEARCH MODEL 04 / PRIVACY-PRESERVING VERIFICATION</text><text x="42" y="86" font-family="Georgia" font-size="29" fill="#30232B">Verify useful information without exposing everything</text><text x="42" y="112" font-family="Arial" font-size="13" fill="#796A61">Conceptual workflow showing the privacy–utility tension</text><g transform="translate(55 155)"><rect width="230" height="155" rx="12" fill="#FDF9F3" stroke="#CBB9A9"/><text x="18" y="30" font-family="Arial" font-size="12" letter-spacing="1.3" fill="#906D79">01 / DATA SOURCES</text><g fill="#80556B"><rect x="22" y="55" width="48" height="55" rx="6"/><rect x="88" y="55" width="48" height="55" rx="6"/><rect x="154" y="55" width="48" height="55" rx="6"/></g><g fill="#F8F3EC" font-family="Arial" font-size="10" text-anchor="middle"><text x="46" y="86">A</text><text x="112" y="86">B</text><text x="178" y="86">C</text></g><text x="18" y="137" font-family="Arial" font-size="11" fill="#796A61">Distributed records</text></g><path d="M295 232h45m-12-8 12 8-12 8" stroke="#A88B68" stroke-width="2" fill="none"/><g transform="translate(350 155)"><rect width="240" height="155" rx="12" fill="#FDF9F3" stroke="#CBB9A9"/><text x="18" y="30" font-family="Arial" font-size="12" letter-spacing="1.3" fill="#906D79">02 / PRIVACY LAYER</text><rect x="22" y="55" width="88" height="48" rx="8" fill="#4A3345"/><rect x="130" y="55" width="88" height="48" rx="8" fill="#B59668"/><g font-family="Arial" font-size="11" text-anchor="middle"><text x="66" y="84" fill="#F8F3EC">Differential</text><text x="174" y="84" fill="#30232B">Secure MPC</text></g><text x="18" y="137" font-family="Arial" font-size="11" fill="#796A61">Limit disclosure / split trust</text></g><path d="M600 232h45m-12-8 12 8-12 8" stroke="#A88B68" stroke-width="2" fill="none"/><g transform="translate(655 155)"><rect width="220" height="155" rx="12" fill="#FDF9F3" stroke="#CBB9A9"/><text x="18" y="30" font-family="Arial" font-size="12" letter-spacing="1.3" fill="#906D79">03 / VERIFICATION</text><circle cx="110" cy="82" r="36" fill="#E9DED3" stroke="#B59668" stroke-width="2"/><path d="M92 82l12 12 25-28" fill="none" stroke="#80556B" stroke-width="5"/><text x="110" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#796A61">Check required claims</text></g><path d="M885 232h45m-12-8 12 8-12 8" stroke="#A88B68" stroke-width="2" fill="none"/><g transform="translate(940 155)"><rect width="205" height="155" rx="12" fill="#4A3345" stroke="#B59668"/><text x="18" y="30" font-family="Arial" font-size="12" letter-spacing="1.3" fill="#D9C5B5">04 / OUTCOME</text><path d="M102 54l37 14v28c0 24-16 40-37 52-21-12-37-28-37-52V68z" fill="#80556B" stroke="#D9C5B5" stroke-width="2"/><path d="M83 96l13 13 26-29" fill="none" stroke="#F8F3EC" stroke-width="4"/><text x="102" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#F8F3EC">Verifiable result</text></g><text x="55" y="354" font-family="Arial" font-size="11" fill="#796A61">Design question: how much privacy can be preserved while retaining sufficient verification accuracy?</text><text x="55" y="375" font-family="Arial" font-size="10" letter-spacing="1.2" fill="#907A6B">SCHEMATIC FROM RESEARCH TOPICS · NOT A MEASURED BENCHMARK</text></svg>