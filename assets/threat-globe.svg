<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jarvis Cyber Command Center: holographic threat globe with animated attack routes, HUD rings, and a scrolling telemetry console.">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151D3F"/><stop offset="1" stop-color="#0E142B"/></linearGradient>
  <radialGradient id="globeFill" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#3B82F6" stop-opacity=".35"/><stop offset=".6" stop-color="#1E1B4B" stop-opacity=".5"/><stop offset="1" stop-color="#0B1020" stop-opacity=".9"/></radialGradient>
  <linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#F43F5E"/></linearGradient>
  <linearGradient id="v" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".5"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="globeClip"><circle cx="0" cy="0" r="100"/></clipPath>
  <clipPath id="console"><rect x="0" y="0" width="520" height="150"/></clipPath>
</defs>
<g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="300" rx="22" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text x="32" y="38" font-size="12" font-weight="700" letter-spacing="3" fill="#FED7AA">JARVIS CYBER COMMAND CENTER · THREAT GLOBE</text>
  <text x="1168" y="38" text-anchor="end" font-size="11" fill="#64748B">Three.js · WebXR · GLSL · Web Audio</text>

  <!-- globe -->
  <g transform="translate(250 170)">
    <!-- HUD rings -->
    <circle r="128" fill="none" stroke="#22D3EE" stroke-opacity=".25" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/></circle>
    <circle r="116" fill="none" stroke="#A855F7" stroke-opacity=".3" stroke-dasharray="40 14 6 14"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite"/></circle>
    <!-- radar sweep -->
    <path d="M0 0 L128 0 A128 128 0 0 0 110.9 -64 Z" fill="url(#sweep)" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></path>

    <!-- globe body -->
    <circle r="100" fill="url(#globeFill)" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.2"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width=".8">
      <!-- latitudes -->
      <ellipse rx="100" ry="14" cy="-70"/><ellipse rx="100" ry="26" cy="-40"/><line x1="-100" y1="0" x2="100" y2="0"/><ellipse rx="100" ry="26" cy="40"/><ellipse rx="100" ry="14" cy="70"/>
      <!-- rotating meridians -->
      <g>
        <ellipse rx="100" ry="100"/><ellipse rx="70" ry="100"/><ellipse rx="35" ry="100"/><line x1="0" y1="-100" x2="0" y2="100"/>
        <animate attributeName="opacity" values=".9;.4;.9" dur="6s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse rx="85" ry="100"><animate attributeName="rx" values="85;10;85" dur="6s" repeatCount="indefinite"/></ellipse>
        <ellipse rx="50" ry="100"><animate attributeName="rx" values="50;95;50" dur="6s" repeatCount="indefinite"/></ellipse>
      </g>
    </g>

    <!-- attack arcs -->
    <g fill="none" stroke-width="1.6" stroke-linecap="round">
      <path d="M-70 20 Q-10 -90 60 -30" stroke="url(#o)" stroke-dasharray="4 4" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
      <path d="M-40 -50 Q30 -80 75 30" stroke="url(#o)" stroke-dasharray="4 4" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.3s" repeatCount="indefinite"/></path>
      <path d="M-80 -10 Q0 60 50 60" stroke="url(#v)" stroke-dasharray="4 4" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite"/></path>
    </g>
    <circle r="3" fill="#FB923C" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M-70 20 Q-10 -90 60 -30"/></circle>
    <circle r="3" fill="#FB923C" filter="url(#glow)"><animateMotion dur="2.6s" begin=".7s" repeatCount="indefinite" path="M-40 -50 Q30 -80 75 30"/></circle>
    <circle r="3" fill="#A855F7" filter="url(#glow)"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite" path="M-80 -10 Q0 60 50 60"/></circle>
    <!-- impact rings -->
    <g fill="none" stroke="#FB923C">
      <circle cx="60" cy="-30" r="2"><animate attributeName="r" values="2;14" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="75" cy="30" r="2"><animate attributeName="r" values="2;14" dur="2.6s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.6s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="60" r="2" stroke="#A855F7"><animate attributeName="r" values="2;14" dur="2.2s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- source nodes -->
    <g fill="#22D3EE"><circle cx="-70" cy="20" r="2.5"/><circle cx="-40" cy="-50" r="2.5"/><circle cx="-80" cy="-10" r="2.5"/></g>
    <!-- particles -->
    <g fill="#FFFFFF" opacity=".6">
      <circle cx="-118" cy="-60" r="1.2"><animate attributeName="cy" values="-60;-80;-60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="122" cy="40" r="1.2"><animate attributeName="cy" values="40;20;40" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="105" cy="-95" r="1"><animate attributeName="cx" values="105;112;105" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="-110" cy="85" r="1"><animate attributeName="cx" values="-110;-120;-110" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- HUD readouts -->
  <g transform="translate(420 70)" font-size="10">
    <text fill="#64748B" letter-spacing="2" font-weight="700">THREAT LEVEL</text>
    <g transform="translate(0 14)">
      <rect width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity=".08"/>
      <rect width="90" height="8" rx="4" fill="url(#o)"><animate attributeName="width" values="90;120;70;90" dur="7s" repeatCount="indefinite"/></rect>
    </g>
    <text y="48" fill="#64748B" letter-spacing="2" font-weight="700">ACTIVE ROUTES</text>
    <text y="76" font-size="26" font-weight="800" fill="#FFFFFF">3<tspan font-size="11" fill="#94A3B8" font-weight="500"> simulated</tspan></text>
    <text y="110" fill="#64748B" letter-spacing="2" font-weight="700">AUDIO</text>
    <g transform="translate(0 120)" fill="#22D3EE">
      <rect x="0" width="4" height="12" rx="2"><animate attributeName="height" values="4;16;6;12;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="4;-4;2;-2;4" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="7" width="4" height="12" rx="2"><animate attributeName="height" values="10;4;16;6;10" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="-1;4;-4;2;-1" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="14" width="4" height="12" rx="2"><animate attributeName="height" values="6;14;4;16;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="2;-2;4;-4;2" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="21" width="4" height="12" rx="2"><animate attributeName="height" values="14;6;12;4;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="-2;2;-1;4;-2" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="28" width="4" height="12" rx="2"><animate attributeName="height" values="4;12;16;8;4" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="4;-1;-4;0;4" dur="1.2s" repeatCount="indefinite"/></rect>
      <text x="40" y="9" font-size="9" fill="#94A3B8">narrator speaking</text>
    </g>
  </g>

  <!-- telemetry console -->
  <g transform="translate(630 62)">
    <rect width="538" height="200" rx="14" fill="#0B1020" stroke="#FFFFFF" stroke-opacity=".1"/>
    <g fill="#FFFFFF" fill-opacity=".25"><circle cx="16" cy="14" r="3.5"/><circle cx="28" cy="14" r="3.5"/><circle cx="40" cy="14" r="3.5"/></g>
    <text x="269" y="18" text-anchor="middle" font-size="9" fill="#64748B" letter-spacing="2">TELEMETRY CONSOLE</text>
    <line x1="0" y1="28" x2="538" y2="28" stroke="#FFFFFF" stroke-opacity=".08"/>
    <g transform="translate(10 36)" clip-path="url(#console)">
      <g font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="11">
        <!-- scrolling block: 10 lines, scrolls up by 5 lines (90px) then resets -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 -18; 0 -18; 0 -36; 0 -36; 0 -54; 0 -54; 0 -72; 0 -72; 0 -90; 0 -90; 0 0" keyTimes="0;.08;.1;.24;.26;.4;.42;.56;.58;.72;.74;.98;1" dur="12s" repeatCount="indefinite"/>
          <text y="14" fill="#64748B">[00:00:01] <tspan fill="#22D3EE">INIT</tspan>     threat globe online · 3 routes loaded</text>
          <text y="32" fill="#64748B">[00:00:03] <tspan fill="#A3E635">OK</tspan>       radar sweep 4.0s · HUD rings locked</text>
          <text y="50" fill="#64748B">[00:00:07] <tspan fill="#FB923C">ALERT</tspan>    route-01 → T1566 phishing · origin 198.51.100.23</text>
          <text y="68" fill="#64748B">[00:00:08] <tspan fill="#A855F7">NARRATE</tspan>  "Inbound credential-harvest attempt detected."</text>
          <text y="86" fill="#64748B">[00:00:11] <tspan fill="#FB923C">ALERT</tspan>    route-02 → T1021 lateral movement · SMB</text>
          <text y="104" fill="#64748B">[00:00:12] <tspan fill="#22D3EE">TRACE</tspan>    particle burst @ impact · shader glsl/pulse.frag</text>
          <text y="122" fill="#64748B">[00:00:15] <tspan fill="#A855F7">NARRATE</tspan>  "Pivot attempt contained at segment boundary."</text>
          <text y="140" fill="#64748B">[00:00:18] <tspan fill="#FB923C">ALERT</tspan>    route-03 → T1498 DDoS · volumetric</text>
          <text y="158" fill="#64748B">[00:00:19] <tspan fill="#A3E635">OK</tspan>       mitigation rule applied · traffic shaped</text>
          <text y="176" fill="#64748B">[00:00:22] <tspan fill="#22D3EE">XR</tspan>       immersive session · controller ray hit globe</text>
          <text y="194" fill="#64748B">[00:00:24] <tspan fill="#A3E635">OK</tspan>       all routes resolved · standing by</text>
          <text y="212" fill="#64748B">[00:00:26] <tspan fill="#22D3EE">INIT</tspan>     cycle restart · 3 routes loaded</text>
        </g>
      </g>
    </g>
    <rect x="10" y="176" width="7" height="12" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</g>
</svg>
