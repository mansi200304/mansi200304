<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Security Incident Response Framework pipeline: log sources to YARA-L and Sigma detection, AI triage, P1 to P4 severity, automated containment or analyst queue, MITRE-mapped playbooks. KPIs: MTTD under 2 minutes, triage time down 40 percent.">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151D3F"/><stop offset="1" stop-color="#0E142B"/></linearGradient>
  <linearGradient id="v" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
  <linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#F43F5E"/></linearGradient>
  <linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="lane" d="M118 118 H300 M300 118 H470 M470 118 H640 M640 118 H790"/>
  <path id="laneTop" d="M790 118 C840 118 840 86 890 86 H1000"/>
  <path id="laneBot" d="M790 118 C840 118 840 150 890 150 H1000"/>
  <path id="laneOut" d="M1000 86 C1040 86 1040 118 1080 118 M1000 150 C1040 150 1040 118 1080 118"/>
</defs>
<g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="320" rx="22" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- title -->
  <text x="32" y="38" font-size="12" font-weight="700" letter-spacing="3" fill="#C4B5FD">SECURITY INCIDENT RESPONSE FRAMEWORK · LIVE PIPELINE</text>
  <text x="1168" y="38" text-anchor="end" font-size="11" fill="#64748B">NIST SP 800-61r2 · MITRE ATT&amp;CK</text>

  <!-- lanes -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2">
    <path d="M118 118 H790"/>
    <path d="M790 118 C840 118 840 86 890 86 H1000 C1040 86 1040 118 1080 118"/>
    <path d="M790 118 C840 118 840 150 890 150 H1000 C1040 150 1040 118 1080 118"/>
  </g>

  <!-- packets flowing (events) -->
  <g>
    <circle r="4" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M60 118 H300"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.95;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" path="M60 118 H300"/></circle>
    <circle r="4" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M60 118 H300"/></circle>
    <circle r="4" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="6s" begin="4.5s" repeatCount="indefinite" path="M60 118 H300"/></circle>
    <!-- one becomes an alert: violet, continues through triage -->
    <circle r="5" fill="#A855F7" filter="url(#glow)"><animateMotion dur="6s" begin="1.6s" repeatCount="indefinite" path="M300 118 H470 H640 H790 C840 118 840 86 890 86 H1000 C1040 86 1040 118 1080 118"/></circle>
    <!-- P3 goes to analyst queue -->
    <circle r="4" fill="#FB923C" filter="url(#glow)"><animateMotion dur="6s" begin="4.6s" repeatCount="indefinite" path="M300 118 H470 H640 H790 C840 118 840 150 890 150 H1000 C1040 150 1040 118 1080 118"/></circle>
  </g>

  <!-- node: log sources -->
  <g transform="translate(40 80)">
    <rect width="78" height="76" rx="14" fill="#0B1020" stroke="url(#c)" stroke-width="1.5"/>
    <g fill="#22D3EE">
      <circle cx="20" cy="22" r="3.5"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="39" cy="22" r="3.5"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="22" r="3.5"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="29" cy="38" r="3.5"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" begin=".6s" repeatCount="indefinite"/></circle>
      <circle cx="49" cy="38" r="3.5"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" begin=".8s" repeatCount="indefinite"/></circle>
    </g>
    <text x="39" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#A5F3FC">LOG SOURCES</text>
    <text x="39" y="92" text-anchor="middle" font-size="10" fill="#64748B">10k events/day</text>
  </g>

  <!-- node: detection -->
  <g transform="translate(300 76)">
    <rect x="-50" width="100" height="84" rx="14" fill="#0B1020" stroke="url(#v)" stroke-width="1.5"/>
    <rect x="-50" width="100" height="84" rx="14" fill="#A855F7" opacity="0"><animate attributeName="opacity" values="0;0;.35;0;0" keyTimes="0;.26;.28;.34;1" dur="6s" repeatCount="indefinite"/></rect>
    <text y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#C4B5FD">DETECTION</text>
    <text y="42" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">YARA-L · Sigma</text>
    <text y="58" text-anchor="middle" font-size="10" fill="#94A3B8">12 rules · 6 techniques</text>
    <text y="74" text-anchor="middle" font-size="9" fill="#64748B">brute force · privesc · lateral</text>
  </g>

  <!-- node: AI triage -->
  <g transform="translate(470 76)">
    <rect x="-50" width="100" height="84" rx="14" fill="#0B1020" stroke="url(#v)" stroke-width="1.5"/>
    <text y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#C4B5FD">AI TRIAGE</text>
    <text y="42" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">Claude API</text>
    <text y="58" text-anchor="middle" font-size="10" fill="#94A3B8">IOC extraction</text>
    <!-- thinking dots -->
    <g fill="#A855F7">
      <circle cx="-10" cy="70" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="70" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="1s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="70" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="1s" begin=".4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- node: severity -->
  <g transform="translate(640 76)">
    <rect x="-50" width="100" height="84" rx="14" fill="#0B1020" stroke="url(#o)" stroke-width="1.5"/>
    <text y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#FED7AA">SEVERITY</text>
    <g font-size="10" font-weight="800" text-anchor="middle">
      <rect x="-42" y="32" width="19" height="16" rx="4" fill="#F43F5E" opacity=".3"><animate attributeName="opacity" values=".3;.3;1;1;.3" keyTimes="0;.42;.45;.6;.65" dur="6s" repeatCount="indefinite"/></rect>
      <text x="-32.5" y="44" fill="#FFFFFF">P1</text>
      <rect x="-20" y="32" width="19" height="16" rx="4" fill="#FB923C" opacity=".3"/>
      <text x="-10.5" y="44" fill="#FFFFFF">P2</text>
      <rect x="2" y="32" width="19" height="16" rx="4" fill="#FACC15" opacity=".3"><animate attributeName="opacity" values=".3;.3;1;1;.3" keyTimes="0;.92;.94;.99;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="11.5" y="44" fill="#0B1020">P3</text>
      <rect x="24" y="32" width="19" height="16" rx="4" fill="#22C55E" opacity=".3"/>
      <text x="33.5" y="44" fill="#FFFFFF">P4</text>
    </g>
    <text y="64" text-anchor="middle" font-size="10" fill="#94A3B8">SLA 15m · 1h · 4h · 24h</text>
    <text y="77" text-anchor="middle" font-size="9" fill="#64748B">escalation matrix</text>
  </g>

  <!-- branch nodes -->
  <g transform="translate(880 62)">
    <rect width="130" height="46" rx="12" fill="#0B1020" stroke="url(#o)" stroke-width="1.5"/>
    <text x="65" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#FED7AA">P1 / P2 → CONTAIN</text>
    <text x="65" y="35" text-anchor="middle" font-size="9" fill="#94A3B8">NGFW · AD · S3 · PagerDuty</text>
  </g>
  <g transform="translate(880 128)">
    <rect width="130" height="46" rx="12" fill="#0B1020" stroke="url(#c)" stroke-width="1.5"/>
    <text x="65" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#A5F3FC">ANALYST QUEUE</text>
    <text x="65" y="35" text-anchor="middle" font-size="9" fill="#94A3B8">Jira ticket · Slack</text>
  </g>

  <!-- playbooks -->
  <g transform="translate(1080 80)">
    <rect width="88" height="76" rx="14" fill="#0B1020" stroke="url(#l)" stroke-width="1.5"/>
    <text x="44" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#D9F99D">PLAYBOOKS</text>
    <g font-size="8.5" fill="#94A3B8" text-anchor="middle">
      <text x="44" y="36">T1566 phishing</text>
      <text x="44" y="48">T1486 ransomware</text>
      <text x="44" y="60">T1078 insider · +3</text>
    </g>
    <text x="44" y="92" text-anchor="middle" font-size="10" fill="#64748B">RCA → rule tuning</text>
  </g>

  <!-- feedback loop arrow -->
  <path d="M1124 176 V204 H300 V164" fill="none" stroke="#A3E635" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <rect x="590" y="196" width="244" height="16" rx="8" fill="#0E142B"/><text x="712" y="208" text-anchor="middle" font-size="9" fill="#A3E635" fill-opacity=".9" letter-spacing="1.5">POST-INCIDENT: RCA · KPI · RULE TUNING</text>

  <!-- KPI strip -->
  <line x1="32" y1="222" x2="1168" y2="222" stroke="#FFFFFF" stroke-opacity=".08"/>
  <g font-size="11">
    <!-- MTTD -->
    <text x="32" y="250" fill="#94A3B8">MTTD</text>
    <text x="32" y="292" fill="#FFFFFF" font-size="22" font-weight="800">&lt; 2 min</text>
    <text x="118" y="292" fill="#64748B" font-size="10">target &lt; 5</text>
    <rect x="200" y="280" width="160" height="6" rx="3" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="200" y="280" width="64" height="6" rx="3" fill="url(#v)"><animate attributeName="width" values="0;64" dur="1.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect>
    <line x1="360" y1="276" x2="360" y2="290" stroke="#64748B"/>
    <text x="200" y="266" fill="#64748B" font-size="9">vs industry avg 197 days</text>

    <!-- triage reduction -->
    <text x="420" y="250" fill="#94A3B8">Alert triage time</text>
    <text x="420" y="292" fill="#FFFFFF" font-size="22" font-weight="800">−40%</text>
    <text x="500" y="292" fill="#64748B" font-size="10">with AI summarization</text>
    <rect x="620" y="280" width="160" height="6" rx="3" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="620" y="280" width="160" height="6" rx="3" fill="#FFFFFF" fill-opacity=".15"/>
    <rect x="620" y="280" width="96" height="6" rx="3" fill="url(#o)"><animate attributeName="width" values="160;96" dur="1.4s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect>

    <!-- detections -->
    <text x="830" y="250" fill="#94A3B8">Coverage</text>
    <text x="830" y="292" fill="#FFFFFF" font-size="22" font-weight="800">6 scenarios</text>
    <text x="960" y="292" fill="#64748B" font-size="10">12 rules · 6 playbooks</text>
    <g transform="translate(1080 272)">
      <rect width="14" height="16" rx="3" fill="url(#l)"><animate attributeName="height" values="0;16" dur=".6s" begin=".2s" fill="freeze"/></rect>
      <rect x="18" width="14" height="16" rx="3" fill="url(#l)"><animate attributeName="height" values="0;16" dur=".6s" begin=".4s" fill="freeze"/></rect>
      <rect x="36" width="14" height="16" rx="3" fill="url(#l)"><animate attributeName="height" values="0;16" dur=".6s" begin=".6s" fill="freeze"/></rect>
      <rect x="54" width="14" height="16" rx="3" fill="url(#l)"><animate attributeName="height" values="0;16" dur=".6s" begin=".8s" fill="freeze"/></rect>
      <rect x="72" width="14" height="16" rx="3" fill="url(#l)"><animate attributeName="height" values="0;16" dur=".6s" begin="1s" fill="freeze"/></rect>
      <rect x="90" width="14" height="16" rx="3" fill="url(#l)"><animate attributeName="height" values="0;16" dur=".6s" begin="1.2s" fill="freeze"/></rect>
    </g>
  </g>
</g>
</svg>
